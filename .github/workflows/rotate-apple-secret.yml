# Rotates the Sign in with Apple client secret in Supabase.
#
# Apple caps the OAuth client secret (an ES256 JWT) at 6 months. This runs on the
# 1st of January, June and November (gaps of 5, 5 and 2 months) so the secret is
# always refreshed before it expires, and can be run by hand from the Actions tab.
#
# Required repository secrets:
#   APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_SERVICES_ID   (see docs/APPLE_SIGNIN_SETUP.md)
#   APPLE_BUNDLE_ID          optional; native app bundle ID kept in the Apple "Client IDs" list
#   APPLE_SIGNIN_P8          full contents of AuthKey_<KEY_ID>.p8
#   SUPABASE_ACCESS_TOKEN    personal access token with auth config write access
#   VITE_SUPABASE_PROJECT_ID already present for the CI build
name: Rotate Apple client secret

on:
  schedule:
    - cron: '0 9 1 1,6,11 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotate-apple-secret
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Generate JWT and push to Supabase
        id: rotate
        run: node scripts/apple-client-secret.mjs --push
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPLE_SIGNIN_P8: ${{ secrets.APPLE_SIGNIN_P8 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Summary
        run: echo "Apple client secret rotated. New secret expires on ${{ steps.rotate.outputs.expires_at }}." >> "$GITHUB_STEP_SUMMARY"
